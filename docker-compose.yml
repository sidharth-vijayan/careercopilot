# Local development stack: the app plus its own Postgres.
#
#   docker compose up --build
#
# Auth and file storage still use your hosted Supabase project (set
# NEXT_PUBLIC_SUPABASE_URL / ANON_KEY in .env.local) — only the application
# database is local here, so you can develop without touching production data.
#
# First run, in another terminal:
#   docker compose exec app npx prisma db push

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recut}
    ports:
      # Loopback only. Published on all interfaces, this would expose the
      # database to everything on the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The app's entrypoint runs migrations immediately, so it must not start
      # until Postgres is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recut} -d ${POSTGRES_DB:-recut}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recut}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recut}
      DIRECT_URL: postgresql://${POSTGRES_USER:-recut}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recut}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DAILY_AI_LIMIT: ${DAILY_AI_LIMIT:-20}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}

volumes:
  postgres-data:
